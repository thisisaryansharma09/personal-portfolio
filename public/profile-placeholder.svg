<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  
  <!-- Subtle Background Tech Grid Lines -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.4"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#accentGlow)" stroke-width="3" filter="url(#glow)" opacity="0.5"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#accentGlow)" stroke-width="2"/>

  <!-- Avatar Silhouette / Modern Stylized Developer Portrait -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Body / Tech Hoodie -->
    <path d="M120 340 C120 275, 150 250, 200 250 C250 250, 280 275, 280 340 Z" fill="#1e293b" />
    <!-- Hoodie V-line & zipper -->
    <path d="M175 258 L200 295 L225 258" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 295 L200 340" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="186" y="215" width="28" height="40" rx="10" fill="#fbcfe8" opacity="0.9" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="48" ry="54" fill="#fed7aa" />

    <!-- Hair -->
    <path d="M150 170 C148 128, 175 118, 200 118 C225 118, 252 128, 250 170 C242 152, 230 148, 215 152 C205 146, 185 145, 175 156 C165 152, 155 160, 150 170 Z" fill="#1e1b4b" />

    <!-- Glasses Frame (Tech/Student look) -->
    <rect x="166" y="170" width="28" height="20" rx="5" fill="none" stroke="#4338ca" stroke-width="3"/>
    <rect x="206" y="170" width="28" height="20" rx="5" fill="none" stroke="#4338ca" stroke-width="3"/>
    <path d="M194 178 L206 178" stroke="#4338ca" stroke-width="3"/>
    
    <!-- Smile -->
    <path d="M188 212 Q200 222 212 212" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Floating Badges -->
  <!-- Excel Floating Pill -->
  <g transform="translate(45, 280)">
    <rect width="105" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
    <text x="52" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">📊 Excel Pro</text>
  </g>

  <!-- B.Tech CSE Floating Pill -->
  <g transform="translate(250, 90)">
    <rect width="115" height="34" rx="17" fill="#312e81" stroke="#818cf8" stroke-width="1.5" opacity="0.95" />
    <text x="57" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">🎓 B.Tech CSE</text>
  </g>

  <!-- Subtle hint text at bottom -->
  <text x="200" y="375" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="500">Aryan Sharma · JECRC University</text>
</svg>
